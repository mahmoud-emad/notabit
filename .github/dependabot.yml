# Weekly dependency updates, grouped so each ecosystem is one pull request.
version: 2
updates:
  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: weekly
    ignore:
      # 3.12 renamed the SQL function and type the job queue calls (v1 to v2), so it
      # needs a migration for existing databases first. See notabit/jobs/__init__.py.
      - dependency-name: procrastinate
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      server:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      # Node moves with CI and the README, LTS releases only, by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # Python stays on 3.14 until the server's dependencies (onnxruntime) ship wheels for the next one.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      images:
        patterns: ["*"]
